name: BuildAL5ReadOnlyPortable

on:
  push:
    branches:
      - 'imob/2.0-al5-readonly-probe'
  workflow_dispatch:

jobs:
  Portable:
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v3

      - name: Restore NuGet packages
        run: nuget restore Apps/PcmApps.sln

      - name: Ensure .NET Framework 4.6.2 Developer Pack
        shell: pwsh
        run: |
          Invoke-WebRequest https://go.microsoft.com/fwlink/?linkid=2099466 -OutFile .\NDP462-DevPack-KB3151934-ENU.exe
          .\NDP462-DevPack-KB3151934-ENU.exe /passive /norestart

      - name: Build PcmHammer
        run: dotnet build Apps/UI/WindowsForms/PcmHammer/PcmHammer.csproj -c Debug -p:GenerateResourceUsePreserializedResources=true

      - name: Stage portable AL5 read-only build
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "Apps/UI/WindowsForms/PcmHammer/bin" -Recurse -File -Filter "PcmHammer.exe" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (!$exe) { throw "PcmHammer.exe not found" }

          New-Item -ItemType Directory -Force -Path "TemporaryArtifactStorage/PcmHammer-AL5-ReadOnly" | Out-Null
          Copy-Item -Path "$($exe.Directory.FullName)/*" -Destination "TemporaryArtifactStorage/PcmHammer-AL5-ReadOnly" -Recurse -Force
          Get-FileHash "TemporaryArtifactStorage/PcmHammer-AL5-ReadOnly/PcmHammer.exe" -Algorithm SHA256

      - name: Upload portable AL5 read-only build
        uses: actions/upload-artifact@v7
        with:
          name: PcmHammer-AL5-ReadOnly-${{ github.sha }}
          path: TemporaryArtifactStorage/PcmHammer-AL5-ReadOnly
