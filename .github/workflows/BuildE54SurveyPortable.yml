name: BuildE54SurveyPortable

on:
  push:
    branches:
      - 'imob/2.0-e54-ram-survey'
  workflow_dispatch:

jobs:
  Kernel:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install m68k toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-m68k-linux-gnu make

      - name: Build E54 kernel
        run: |
          cd Kernels
          mkdir -p build
          make -f makefile-assembly \
            PREFIX=/usr/bin/m68k-linux-gnu- \
            pcm=E54 \
            address=FF9100 \
            srcdir=68k-VPW-Asm
          test -s build/Kernel-E54.bin
          sha256sum build/Kernel-E54.bin

      - name: Upload E54 kernel
        uses: actions/upload-artifact@v7
        with:
          name: E54-Survey-Kernel-${{ github.sha }}
          path: Kernels/build/Kernel-E54.bin

  Portable:
    needs: Kernel
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v3

      - name: Restore NuGet packages
        run: nuget restore Apps/PcmApps.sln

      - name: Ensure .NET Framework 4.6.2 Developer Pack
        shell: pwsh
        run: |
          Invoke-WebRequest https://go.microsoft.com/fwlink/?linkid=2099466 -OutFile .\NDP462-DevPack-KB3151934-ENU.exe
          .\NDP462-DevPack-KB3151934-ENU.exe /passive /norestart

      - name: Build PcmHammer
        run: dotnet build Apps/UI/WindowsForms/PcmHammer/PcmHammer.csproj -c Debug -p:GenerateResourceUsePreserializedResources=true

      - name: Download E54 kernel
        uses: actions/download-artifact@v8
        with:
          name: E54-Survey-Kernel-${{ github.sha }}
          path: TemporaryArtifactStorage/E54Kernel

      - name: Stage portable survey build
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "Apps/UI/WindowsForms/PcmHammer/bin" -Recurse -File -Filter "PcmHammer.exe" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (!$exe) { throw "PcmHammer.exe not found" }

          New-Item -ItemType Directory -Force -Path "TemporaryArtifactStorage/PcmHammer-E54-Survey" | Out-Null
          Copy-Item -Path "$($exe.Directory.FullName)/*" -Destination "TemporaryArtifactStorage/PcmHammer-E54-Survey" -Recurse -Force
          Copy-Item -Path "TemporaryArtifactStorage/E54Kernel/Kernel-E54.bin" -Destination "TemporaryArtifactStorage/PcmHammer-E54-Survey/Kernel-E54.bin" -Force

          Get-FileHash "TemporaryArtifactStorage/PcmHammer-E54-Survey/PcmHammer.exe" -Algorithm SHA256
          Get-FileHash "TemporaryArtifactStorage/PcmHammer-E54-Survey/Kernel-E54.bin" -Algorithm SHA256

      - name: Upload portable E54 survey build
        uses: actions/upload-artifact@v7
        with:
          name: PcmHammer-E54-RAM-Survey-${{ github.sha }}
          path: TemporaryArtifactStorage/PcmHammer-E54-Survey
